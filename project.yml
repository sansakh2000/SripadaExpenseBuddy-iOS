name: SripadaExpenseBuddy
options:
  bundleIdPrefix: com.sripada
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.sripada.expensebuddy
    DEVELOPMENT_TEAM: ""
    INFOPLIST_FILE: SripadaExpenseBuddy/Info.plist
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: "NO"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      VALIDATE_PRODUCT: "YES"

targets:
  SripadaExpenseBuddy:
    type: application
    platform: iOS
    sources:
      - path: SripadaExpenseBuddy
    info:
      path: SripadaExpenseBuddy/Info.plist
      properties:
        CFBundleDisplayName: Sripada Expense
        CFBundleName: SripadaExpenseBuddy
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Used for voice transaction entry — speak your expense and we'll record it."
        NSSpeechRecognitionUsageDescription: "Converts your spoken expense into a transaction automatically."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: SripadaExpenseBuddy/SripadaExpenseBuddy.entitlements
      properties:
        com.apple.developer.in-app-payments:
          - com.sripada.expensebuddy.monthly
          - com.sripada.expensebuddy.yearly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sripada.expensebuddy
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
