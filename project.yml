name: SripadaExpenseBuddy
options:
  bundleIdPrefix: com.sripada
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.sripada.expensebuddy
    DEVELOPMENT_TEAM: ""           # fill in your Apple Team ID
    INFOPLIST_FILE: SripadaExpenseBuddy/Info.plist
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad

targets:
  SripadaExpenseBuddy:
    type: application
    platform: iOS
    sources:
      - path: SripadaExpenseBuddy
    info:
      path: SripadaExpenseBuddy/Info.plist
      properties:
        CFBundleDisplayName: Sripada Expense
        CFBundleName: SripadaExpenseBuddy
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Used for voice transaction entry — speak your expense and we'll record it."
        NSSpeechRecognitionUsageDescription: "Converts your spoken expense into a transaction automatically."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
    entitlements:
      path: SripadaExpenseBuddy/SripadaExpenseBuddy.entitlements
      properties:
        com.apple.developer.in-app-payments:
          - com.sripada.expensebuddy.monthly
          - com.sripada.expensebuddy.yearly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sripada.expensebuddy
